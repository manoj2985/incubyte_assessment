services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dealership
      MYSQL_USER: dealership
      MYSQL_PASSWORD: dealership
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - dealership-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealership-data:

